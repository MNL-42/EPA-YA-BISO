<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07111b"><title>EPA-YA-BISO — Kinshasa Open City</title>
<style>
:root{color-scheme:dark;--gold:#f3bd52;--cyan:#54d9d0}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111b;font-family:Inter,system-ui,Arial;color:#fff}canvas{display:block;width:100%;height:100%;touch-action:none;background:#8b9a80}#hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.brand,.pill,.hint,.panel{background:rgba(5,14,22,.78);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(12px);box-shadow:0 8px 28px #0005}.brand{padding:10px 13px;border-radius:14px}.brand b{display:block;letter-spacing:2px;color:var(--gold);font-size:15px}.brand small{color:#b9c9d0;font-size:10px;letter-spacing:1.5px}.pill{padding:9px 12px;border-radius:999px;font-size:11px;color:#d7e3e7}.panel{position:absolute;left:12px;bottom:12px;padding:10px 12px;border-radius:13px;font-size:11px;color:#d4e0e3;max-width:190px}.panel strong{color:var(--gold);display:block;font-size:12px;margin-bottom:3px}.hint{position:absolute;top:76px;left:50%;transform:translateX(-50%);padding:7px 12px;border-radius:999px;font-size:10px;white-space:nowrap;color:#e8eeee}.controls{position:absolute;right:14px;bottom:18px;display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,48px);gap:5px;pointer-events:auto}.ctrl{border:1px solid #ffffff35;background:#071522c9;color:#fff;border-radius:13px;font-size:20px;touch-action:none}.ctrl:active{background:#c28a2c}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}.action{position:absolute;right:14px;bottom:132px;pointer-events:auto;border:1px solid #f3bd5280;background:#8d5e1bd9;color:#fff;border-radius:13px;padding:11px 14px;font-weight:700;font-size:11px}.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#06121ee8;border:1px solid #f3bd5277;padding:14px 18px;border-radius:14px;text-align:center;opacity:0;transition:opacity .25s;max-width:85%;font-size:13px}.toast.show{opacity:1}@media(min-width:800px){.controls{right:28px;bottom:28px;transform:scale(1.15);transform-origin:bottom right}.panel{bottom:22px;left:22px}.top{top:20px;left:20px;right:20px}}
</style></head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="top"><div class="brand"><b>EPA-YA-BISO</b><small>KINSHASA • OPEN CITY</small></div><div class="pill" id="zone">📍 GOMBE</div></div><div class="hint">EXPLORE KIN • touche les flèches pour te déplacer</div><div class="panel"><strong id="mode">À PIED</strong><span id="status">Bienvenue na Kinshasa !</span><br><span style="color:#8fa5ac">Prototype jouable • Démo 01</span></div><button class="action" id="action">MONTER DANS LE TAXI</button><div class="controls"><button class="ctrl up" data-key="up">▲</button><button class="ctrl left" data-key="left">◀</button><button class="ctrl down" data-key="down">▼</button><button class="ctrl right" data-key="right">▶</button></div><div class="toast" id="toast"></div></div>
<script>
(()=>{
const c=document.getElementById('game'),ctx=c.getContext('2d');let W=0,H=0,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const world={w:2400,h:1800};const roads=[{x:0,y:380,w:2400,h:150},{x:0,y:940,w:2400,h:160},{x:460,y:0,w:150,h:1800},{x:1430,y:0,w:150,h:1800},{x:0,y:1450,w:2400,h:130}];
const blocks=[];for(let y=40;y<world.h-100;y+=290)for(let x=40;x<world.w-100;x+=310){if(roads.some(r=>x<r.x+r.w+20&&x+235>r.x-20&&y<r.y+r.h+20&&y+185>r.y-20))continue;blocks.push({x,y,w:180+((x+y)%50),h:115+((x*3+y)%50),color:['#d5b58a','#bd9c78','#c8c2aa','#a9b39a','#d3c6a6'][Math.floor((x+y)/100)%5],name:['PARCELLE','BOUTIQUE','MAISON','ATELIER'][Math.floor((x*7+y)/130)%4]})}
const props=[];for(let i=0;i<75;i++){let x=(i*197+130)%world.w,y=(i*283+80)%world.h;if(!roads.some(r=>x>r.x&&x<r.x+r.w&&y>r.y&&y<r.y+r.h))props.push({x,y})}
let player={x:780,y:650,angle:0,inCar:false,speed:0};let keys={};let last=0,cam={x:0,y:0};let toastTimer=0;
function say(t){let el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1800)}
function zone(){if(player.x<650)return'GOMBE';if(player.x<1400)return'MATONGE';return'LIMETE'}
function rect(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(x,y,w,h)}
function drawRoad(r){rect(r.x,r.y,r.w,r.h,'#454b4d');rect(r.x,r.y+7,r.w,r.h-14,'#555b5d');ctx.strokeStyle='#d9c78a';ctx.lineWidth=3;ctx.setLineDash([28,24]);ctx.beginPath();if(r.w>r.h){ctx.moveTo(r.x,r.y+r.h/2);ctx.lineTo(r.x+r.w,r.y+r.h/2)}else{ctx.moveTo(r.x+r.w/2,r.y);ctx.lineTo(r.x+r.w/2,r.y+r.h)}ctx.stroke();ctx.setLineDash([])}
function draw(){ctx.clearRect(0,0,W,H);let targetX=player.x-W/2,targetY=player.y-H/2;cam.x+=(Math.max(0,Math.min(world.w-W,targetX))-cam.x)*.12;cam.y+=(Math.max(0,Math.min(world.h-H,targetY))-cam.y)*.12;ctx.save();ctx.translate(-cam.x,-cam.y);
rect(0,0,world.w,world.h,'#87977d');
for(let x=0;x<world.w;x+=90)for(let y=0;y<world.h;y+=90){ctx.fillStyle=((x+y)/90)%2?'#829378':'#899a80';ctx.fillRect(x,y,90,90)}
roads.forEach(drawRoad);
blocks.forEach(b=>{ctx.fillStyle='#0003';ctx.fillRect(b.x+9,b.y+12,b.w,b.h);rect(b.x,b.y,b.w,b.h,b.color);rect(b.x,b.y,b.w,12,'#8b715b');rect(b.x+12,b.y+25,22,20,'#526c70');rect(b.x+48,b.y+25,22,20,'#526c70');rect(b.x+85,b.y+25,22,20,'#526c70');rect(b.x+12,b.y+65,35,35,'#987d60');ctx.fillStyle='#352e28';ctx.font='10px Arial';ctx.fillText(b.name,b.x+10,b.y+b.h+14)});
props.forEach(p=>{ctx.fillStyle='#315d3c';ctx.beginPath();ctx.arc(p.x,p.y,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#487a4c';ctx.beginPath();ctx.arc(p.x-3,p.y-4,6,0,Math.PI*2);ctx.fill()});
// road-side market stalls
for(let i=0;i<15;i++){let x=80+i*145,y=350;rect(x,y,48,25,['#e6b44e','#d65d43','#4d9b8c'][i%3]);rect(x+5,y+5,38,4,'#fff8')}
ctx.fillStyle='#fff';ctx.font='bold 17px Arial';ctx.fillText('GOMBE',690,300);ctx.fillText('MATONGE',850,880);ctx.fillText('LIMETE',1680,1390);
ctx.fillStyle='#9bd7e4';ctx.font='12px Arial';ctx.fillText('AVENUE DU COMMERCE',640,365);ctx.fillText('BOULEVARD DU 30 JUIN',700,925);
// parked taxis and traffic
car(780,650,'#e8bd39',0);\nfor(let i=0;i<11;i++){let x=(i*223+300)%world.w,y=[405,970,1480][i%3]+(i%2)*38;car(x,y,'#e9c43e',0)}
if(player.inCar){car(player.x,player.y,'#e8bd39',player.angle)}else{ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.angle);ctx.fillStyle='#182a36';ctx.beginPath();ctx.ellipse(0,5,10,13,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d99b72';ctx.beginPath();ctx.arc(0,-7,7,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f0eee5';ctx.fillRect(-7,1,14,10);ctx.restore()}
ctx.restore();drawMini();requestAnimationFrame(draw)}
function car(x,y,col,a){ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.fillStyle='#0004';ctx.fillRect(-23,-11+4,48,25);ctx.fillStyle=col;ctx.fillRect(-24,-13,48,24);ctx.fillStyle='#233d4a';ctx.fillRect(-12,-10,22,18);ctx.fillStyle='#dbe6df';ctx.fillRect(18,-9,4,5);ctx.fillRect(18,4,4,5);ctx.restore()}
function drawMini(){let mw=104,mh=76,x=W-116,y=H-91;ctx.fillStyle='#07131dcc';ctx.fillRect(x,y,mw,mh);ctx.strokeStyle='#ffffff55';ctx.strokeRect(x,y,mw,mh);ctx.fillStyle='#62696a';roads.forEach(r=>ctx.fillRect(x+r.x/world.w*mw,y+r.y/world.h*mh,Math.max(2,r.w/world.w*mw),Math.max(2,r.h/world.h*mh)));ctx.fillStyle='#f5c24e';ctx.beginPath();ctx.arc(x+player.x/world.w*mw,y+player.y/world.h*mh,4,0,7);ctx.fill()}
function update(dt){let dx=0,dy=0;if(keys.left||keys.a)dx--;if(keys.right||keys.d)dx++;if(keys.up||keys.w)dy--;if(keys.down||keys.s)dy++;if(dx||dy){let l=Math.hypot(dx,dy);dx/=l;dy/=l;player.angle=Math.atan2(dy,dx);let sp=player.inCar?260:150;player.x+=dx*sp*dt;player.y+=dy*sp*dt}player.x=Math.max(20,Math.min(world.w-20,player.x));player.y=Math.max(20,Math.min(world.h-20,player.y));document.getElementById('zone').textContent='📍 '+zone();document.getElementById('mode').textContent=player.inCar?'EN TAXI':'À PIED';document.getElementById('action').textContent=player.inCar?'DESCENDRE DU TAXI':'MONTER DANS LE TAXI'}
let prev=performance.now();function loop(t){let dt=Math.min((t-prev)/1000,.04);prev=t;update(dt)}setInterval(()=>{},1000);function frame(t){let dt=Math.min((t-last)/1000||0,.04);last=t;update(dt);requestAnimationFrame(frame)}requestAnimationFrame(frame);requestAnimationFrame(draw);
document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});
addEventListener('keydown',e=>{let m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};keys[m[e.key]||e.key.toLowerCase()]=true});addEventListener('keyup',e=>{let m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};keys[m[e.key]||e.key.toLowerCase()]=false});
document.getElementById('action').onclick=()=>{let near= Math.hypot(player.x-780,player.y-650)<110||Math.hypot(player.x-300,player.y-405)<110;if(player.inCar){player.inCar=false;say('Okit, tokobi lisusu na makolo !')}else if(near){player.inCar=true;say('Taxi ya Kinshasa ! Tokende.')}else say('Approche-toi d’un taxi jaune pour monter.');};
document.getElementById('status').textContent='Explore librement la ville.';
say('Bienvenue na EPA-YA-BISO !');
})();
</script></body></html>
