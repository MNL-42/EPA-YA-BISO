<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#091522"><title>EPA-YA-BISO — Kinshasa 3D</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <header><div class="logo"><b>EPA-YA-BISO</b><small>KINSHASA • PROTOTYPE 3D</small></div><div id="district">GOMBE</div></header>
  <div id="mission"><b>EXPLORATION LIBRE</b><span>Découvre la ville. Approche un taxi jaune pour monter.</span></div>
  <div id="status">À PIED · Bienvenue na Kinshasa !</div>
  <div id="controls">
    <div class="pad">
      <button data-key="forward">▲</button>
      <div><button data-key="left">◀</button><button data-key="back">▼</button><button data-key="right">▶</button></div>
    </div>
    <button id="interact">MONTER DANS UN TAXI</button>
  </div>
  <div id="crosshair">+</div>
  <div id="loading">EPA-YA-BISO<br><small>Chargement de Kinshasa…</small></div>
</div>
<script type="module" src="./game.js"></script>
</body></html>
